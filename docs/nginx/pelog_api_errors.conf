# PELOG - override nginx per situs (aaPanel extension include)
#
# Pasang sebagai:
#   /www/server/panel/vhost/nginx/extension/pelog.smkn1mas.sch.id/pelog_api_errors.conf
#
# aaPanel mengaktifkan `fastcgi_intercept_errors on;` secara global dan
# `error_page 404 /404.html;` per situs. Tanpa override ini, setiap respons 404
# JSON dari Laravel (mis. `session_not_found`) diintersep nginx dan request
# diproses ulang lewat index.php sebagai GET sehingga kiosk menerima pesan
# "The GET method is not supported for route ..." alih-alih JSON 404.
#
# Setelah mengubah file ini: nginx -t && nginx -s reload
fastcgi_intercept_errors off;
